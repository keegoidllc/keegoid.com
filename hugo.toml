baseURL = 'https://keegoid.com/'
languageCode = 'en-US'
title = 'Keegoid'
enableRobotsTXT = true
enableGitInfo = true

[params]
  mainSections = ["posts"]
  description = "Practical AI consulting, everyday remote computer support, and developer testing materials from Keegoid LLC."
  defaultImage = "https://keegoid.com/images/brand/keegoid-og-card.png"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "github"
    lineNumbers = true
    defaultLang = ""
    noClasses = false
    useClasses = true
  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true
    [markup.goldmark.extensions]
      table = true
      linkify = true

[outputs]
  home = ["HTML"]
  page = []
  section = []
  taxonomy = []
