<div class="service-grid">
{{ range (where .Site.RegularPages "Section" "services").ByWeight }}
  <article class="service-card">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="card-summary">{{ .Params.summary }}</p>
    {{ partial "service-price.html" (dict "page" . "variant" "card") }}
    {{ if .Params.inquiry_only }}<p class="card-summary">{{ .Params.format }}</p>{{ end }}
    <a class="card-link" href="{{ .RelPermalink }}">Explore {{ .Title }} <span aria-hidden="true">→</span></a>
  </article>
{{ end }}
</div>
