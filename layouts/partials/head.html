<head>
  <meta charset="UTF-8">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ if .Params.private }}<meta name="robots" content="noindex, nofollow, noarchive">{{ end }}

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ with .Params.background_image }}{{ . | absURL }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ with .Params.background_image }}{{ . | absURL }}{{ else }}{{ .Site.Params.defaultImage | absURL }}{{ end }}">

  <!-- Fonts -->
  <link rel="preload" href="/fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- CSS Styles -->
  {{ $styleMain := resources.Get "css/style.css" }}
  {{ $styleSyntax := resources.Get "css/syntax.css" }}
  {{ $styles := slice $styleSyntax $styleMain | resources.Concat "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.Permalink }}" integrity="{{ $styles.Data.Integrity }}">
  <link rel="icon" href="/favicon.ico?v={{ readFile "static/favicon.ico" | sha256 | truncate 12 "" }}" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/brand/keegoid-tile-64.png?v={{ readFile "static/images/brand/keegoid-tile-64.png" | sha256 | truncate 12 "" }}">
  <link rel="icon" href="/favicon.svg?v={{ readFile "static/favicon.svg" | sha256 | truncate 12 "" }}" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/keegoid-touch-icon.png?v={{ readFile "static/images/brand/keegoid-touch-icon.png" | sha256 | truncate 12 "" }}">
</head>
