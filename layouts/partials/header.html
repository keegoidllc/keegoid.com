<a class="skip-link" href="#main-content">Skip to content</a>
<header class="masthead masthead--compact">
  <div class="page header-row">
    <a class="masthead-lockup" href="{{ "/" | relURL }}" aria-label="Keegoid home">
      <p class="masthead-title"><img class="masthead-logo" src="{{ "images/brand/keegoid-logo.svg" | relURL }}?v={{ readFile "static/images/brand/keegoid-logo.svg" | sha256 | truncate 12 "" }}" width="1491" height="321" alt="Keegoid LLC"></p>
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="{{ "/services/" | relURL }}"{{ if eq .Section "services" }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Services</a>
      <a href="{{ "/terms/" | relURL }}"{{ if eq .Section "terms" }} aria-current="{{ if .IsSection }}page{{ else }}true{{ end }}"{{ end }}>Scope & terms</a>
    </nav>
  </div>
</header>
